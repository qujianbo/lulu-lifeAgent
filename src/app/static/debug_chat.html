<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生活管家 Agent 调试</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --panel-2: #eef3f7;
        --text: #17202a;
        --muted: #667085;
        --line: #d7dde5;
        --accent: #126b5e;
        --accent-dark: #0c4f45;
        --error: #b42318;
        --shadow: 0 12px 28px rgba(16, 24, 40, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        min-height: 100vh;
        padding: 16px;
      }

      .chat,
      .side {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .chat {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: calc(100vh - 32px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.3;
        font-weight: 700;
      }

      .status {
        min-width: 88px;
        text-align: right;
        color: var(--muted);
        font-size: 13px;
      }

      .messages {
        overflow-y: auto;
        padding: 18px 16px;
      }

      .message {
        display: flex;
        margin-bottom: 14px;
      }

      .message.user {
        justify-content: flex-end;
      }

      .bubble {
        max-width: min(720px, 78%);
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .assistant .bubble {
        background: var(--panel-2);
      }

      .user .bubble {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }

      .composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }

      textarea {
        width: 100%;
        min-height: 50px;
        max-height: 140px;
        resize: vertical;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
      }

      textarea:focus,
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(18, 107, 94, 0.14);
      }

      button {
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        padding: 0 18px;
        min-width: 84px;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .side {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        min-height: calc(100vh - 32px);
      }

      .section {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: 0;
      }

      .section h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      input {
        width: 100%;
        height: 38px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
      }

      .quick {
        display: grid;
        gap: 8px;
      }

      .quick button {
        width: 100%;
        height: 36px;
        background: #1f2937;
        text-align: left;
        font-weight: 600;
      }

      .secondary {
        width: 100%;
        height: 36px;
        margin-top: 10px;
        background: #475467;
      }

      .action-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        margin-top: 10px;
      }

      .action-row button {
        height: 38px;
        min-width: 76px;
        padding: 0 12px;
        background: #475467;
      }

      .meta {
        display: grid;
        gap: 9px;
        color: var(--muted);
        font-size: 13px;
      }

      .meta-row {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr);
        gap: 8px;
      }

      .meta-value {
        color: var(--text);
        overflow-wrap: anywhere;
      }

      pre {
        margin: 0;
        max-height: 280px;
        overflow: auto;
        padding: 10px;
        background: #111827;
        color: #e5e7eb;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.55;
      }

      .error {
        color: var(--error);
      }

      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }

        .chat,
        .side {
          min-height: auto;
        }

        .chat {
          height: calc(100vh - 32px);
        }

        .bubble {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="chat" aria-label="Agent 对话">
        <header class="topbar">
          <h1>生活管家 Agent</h1>
          <div id="status" class="status">待发送</div>
        </header>
        <div id="messages" class="messages"></div>
        <form id="chat-form" class="composer">
          <textarea id="message-input" placeholder="输入要验证的消息"></textarea>
          <button id="send-button" type="submit">发送</button>
        </form>
      </section>

      <aside class="side">
        <section class="section">
          <h2>访问</h2>
          <label for="token-input">Admin Token</label>
          <input id="token-input" type="password" autocomplete="off" />
        </section>

        <section class="section">
          <h2>样例</h2>
          <div class="quick">
            <button type="button" data-prompt="明早 8 点提醒我带身份证">
              明早 8 点提醒我带身份证
            </button>
            <button type="button" data-prompt="今天有什么适合关注的科技新闻？">
              今天有什么适合关注的科技新闻？
            </button>
            <button type="button" data-prompt="怎么安排今天的工作？">
              怎么安排今天的工作？
            </button>
          </div>
        </section>

        <section class="section">
          <h2>结果</h2>
          <div class="meta">
            <div class="meta-row"><span>Intent</span><span id="intent" class="meta-value">-</span></div>
            <div class="meta-row"><span>Model</span><span id="model" class="meta-value">-</span></div>
            <div class="meta-row"><span>Latency</span><span id="latency" class="meta-value">-</span></div>
            <div class="meta-row"><span>User ID</span><span id="user-id" class="meta-value">-</span></div>
            <pre id="tool-result">null</pre>
            <button id="refresh-reminders" class="secondary" type="button">刷新提醒</button>
            <pre id="reminders">[]</pre>
            <div class="action-row">
              <input id="trigger-reminder-id" type="number" min="1" placeholder="提醒 ID" />
              <button id="trigger-now" type="button">触发</button>
            </div>
            <button id="run-scheduler" class="secondary" type="button">执行调度</button>
            <button id="refresh-jobs" class="secondary" type="button">刷新任务</button>
            <pre id="scheduled-jobs">[]</pre>
          </div>
        </section>
      </aside>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message-input");
      const tokenInput = document.querySelector("#token-input");
      const messages = document.querySelector("#messages");
      const statusNode = document.querySelector("#status");
      const sendButton = document.querySelector("#send-button");
      const intentNode = document.querySelector("#intent");
      const modelNode = document.querySelector("#model");
      const latencyNode = document.querySelector("#latency");
      const userIdNode = document.querySelector("#user-id");
      const toolNode = document.querySelector("#tool-result");
      const remindersNode = document.querySelector("#reminders");
      const jobsNode = document.querySelector("#scheduled-jobs");
      const refreshRemindersButton = document.querySelector("#refresh-reminders");
      const refreshJobsButton = document.querySelector("#refresh-jobs");
      const runSchedulerButton = document.querySelector("#run-scheduler");
      const triggerNowButton = document.querySelector("#trigger-now");
      const triggerReminderIdInput = document.querySelector("#trigger-reminder-id");

      tokenInput.value = localStorage.getItem("life-agent-admin-token") || "";
      tokenInput.addEventListener("input", () => {
        localStorage.setItem("life-agent-admin-token", tokenInput.value.trim());
      });

      document.querySelectorAll("[data-prompt]").forEach((button) => {
        button.addEventListener("click", () => {
          input.value = button.dataset.prompt;
          input.focus();
        });
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        appendMessage("user", text);
        input.value = "";
        setLoading(true);

        try {
          const headers = { "content-type": "application/json" };
          const token = tokenInput.value.trim();
          if (token) headers["x-admin-token"] = token;

          const response = await fetch("/api/local/chat", {
            method: "POST",
            headers,
            body: JSON.stringify({ message: text }),
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.detail || `HTTP ${response.status}`);
          }

          appendMessage("assistant", payload.content || "");
          renderMeta(payload);
          await loadReminders();
          await loadScheduledJobs();
          statusNode.textContent = "完成";
          statusNode.classList.remove("error");
        } catch (error) {
          appendMessage("assistant", `请求失败：${error.message}`);
          statusNode.textContent = "失败";
          statusNode.classList.add("error");
        } finally {
          setLoading(false);
        }
      });

      refreshRemindersButton.addEventListener("click", loadReminders);
      refreshJobsButton.addEventListener("click", loadScheduledJobs);
      runSchedulerButton.addEventListener("click", runSchedulerOnce);
      triggerNowButton.addEventListener("click", triggerReminderNow);

      function appendMessage(role, text) {
        const item = document.createElement("div");
        item.className = `message ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        item.appendChild(bubble);
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      function renderMeta(payload) {
        intentNode.textContent = payload.intent || "-";
        modelNode.textContent = payload.model || "-";
        latencyNode.textContent = payload.latency_ms ? `${payload.latency_ms} ms` : "-";
        userIdNode.textContent = payload.user_id || "-";
        toolNode.textContent = JSON.stringify(payload.tool_result, null, 2);
      }

      async function loadReminders() {
        const headers = {};
        const token = tokenInput.value.trim();
        if (token) headers["x-admin-token"] = token;
        const response = await fetch("/api/local/reminders", { headers });
        const payload = await response.json();
        if (!response.ok) {
          remindersNode.textContent = JSON.stringify(payload, null, 2);
          return;
        }
        userIdNode.textContent = payload.user_id || userIdNode.textContent;
        remindersNode.textContent = JSON.stringify(payload.items || [], null, 2);
      }

      async function loadScheduledJobs() {
        const headers = {};
        const token = tokenInput.value.trim();
        if (token) headers["x-admin-token"] = token;
        const response = await fetch("/api/local/scheduled-jobs", { headers });
        const payload = await response.json();
        if (!response.ok) {
          jobsNode.textContent = JSON.stringify(payload, null, 2);
          return;
        }
        jobsNode.textContent = JSON.stringify(payload.items || [], null, 2);
      }

      async function runSchedulerOnce() {
        const payload = await postJson("/api/local/scheduler/run-once", {});
        statusNode.textContent = `调度 ${payload.succeeded}/${payload.scanned}`;
        await loadScheduledJobs();
        await loadReminders();
      }

      async function triggerReminderNow() {
        const reminderId = triggerReminderIdInput.value.trim();
        if (!reminderId) return;
        await postJson(`/api/local/reminders/${reminderId}/trigger-now`, {});
        statusNode.textContent = "已入队";
        await loadScheduledJobs();
      }

      async function postJson(url, body) {
        const headers = { "content-type": "application/json" };
        const token = tokenInput.value.trim();
        if (token) headers["x-admin-token"] = token;
        const response = await fetch(url, {
          method: "POST",
          headers,
          body: JSON.stringify(body),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || `HTTP ${response.status}`);
        }
        return payload;
      }

      function setLoading(isLoading) {
        sendButton.disabled = isLoading;
        statusNode.textContent = isLoading ? "请求中" : statusNode.textContent;
      }

      appendMessage("assistant", "我在，可以开始验证。");
      loadReminders();
      loadScheduledJobs();
    </script>
  </body>
</html>
